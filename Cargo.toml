[package]
name = "embedding-pipeline"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.89"
clap = { version = "4.5", features = ["derive"] }
futures = "0.3"
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0"
tokenizers = "0.23.2"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "time", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
unicode-segmentation = "1.12"

[dev-dependencies]
mockall = "0.13.1"
criterion = { version = "0.5", features = ["async_tokio"] }

[[bench]]
name = "pipeline_benchmarks"
harness = false

[[bin]]
name = "embed-cli"
path = "src/bin/embed_cli.rs"


