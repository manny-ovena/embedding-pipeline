[package]
name = "embedding-pipeline"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.89"
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokenizers = "0.23.2"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
mockall = "0.13.1"
